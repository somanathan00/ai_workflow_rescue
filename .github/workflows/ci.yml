name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
          POSTGRES_DB: workflow_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://workflow:workflow@localhost:5432/workflow_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      ENVIRONMENT: test
      # The Gemini key is deliberately absent: tests mock the model.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Apply migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Check models match migrations
        run: alembic check
        working-directory: backend
      - name: Run tests
        # Exit code 5 means "no tests collected"; tolerated until the
        # suite exists, any real failure still fails the job.
        run: pytest || [ $? -eq 5 ]
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t ai-workflow-rescue-starter:ci ./backend
      - run: docker build -t ai-workflow-rescue-frontend:ci ./frontend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend

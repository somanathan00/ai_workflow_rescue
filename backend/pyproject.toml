[project]
name = "ai-workflow-rescue"
version = "0.1.0"
description = "AI-assisted workflow failure investigation and recovery"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI Depends()/Header() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "F401"]
"app/models/__init__.py" = ["E501"]
# Fixture descriptions and CLI help are prose; wrapping them hurts readability.
"app/agents/evaluation.py" = ["E501"]
"scripts/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
